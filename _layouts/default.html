<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

<head>
    {% include head.html %}
</head>

<body>
    <script>
        // Applies the given theme, or the saved one (light by default). Runs
        // here, before the first paint, to avoid a flash of the wrong theme;
        // again on back/forward navigation (pageshow) and from
        // assets/js/theme-and-loader.js when the toggle is used.
        window.applyTheme = (isDark) => {
            if (isDark === undefined) {
                try {
                    isDark = localStorage.getItem('dark-mode-state') === '1';
                } catch {
                    isDark = false; // storage blocked by the browser
                }
            }
            document.body.classList.toggle('dark-mode', isDark);
            document.querySelector('.color-mode-icon')?.classList.toggle('active', isDark);
        };
        window.applyTheme();
        window.addEventListener('pageshow', () => window.applyTheme());
    </script>
    {% include loader.html %}
    {% include nav.html %}

    <main>
        {{ content }}
    </main>

    {% unless page.hide_footer %}
    {% include footer.html %}
    {% endunless %}

    <script defer src="{{ '/assets/js/theme-and-loader.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>

</html>
