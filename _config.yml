# Site settings
title: "Kağan Can Şit"
description: "Software Engineer - Projects, blog posts and more..."
url: "https://kagancansit.github.io"
baseurl: ""
lang: en

# Author: jekyll-seo-tag uses it for the author and X (Twitter) card tags
author:
  name: "Kağan Can Şit"
  twitter: "kagancansit"

# Social links (icons on the homepage and in the footer)
email: "kagancansit@hotmail.com"
linkedin: "kagancansit"
github: "KaganCanSit"
twitter:
  username: "kagancansit"

# Google Analytics
google_analytics: "G-2BLQV2M3JL"

# Build settings (Markdown, code highlighting and encoding use Jekyll's defaults)
permalink: /blog/:title/

sass:
  style: compressed
  sourcemap: never # If require CSS debug remove this

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - notes.md # Notes for me

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2

# Blog pagination (jekyll-paginate-v2). Only pages with a `pagination:`
# front-matter block (see blog.html) are actually paginated.
pagination:
  enabled: true
  per_page: 9
  permalink: '/:num/'
  title: ':title - Page :num'
  sort_field: 'date'
  sort_reverse: true
  trail:
    before: 2
    after: 2
