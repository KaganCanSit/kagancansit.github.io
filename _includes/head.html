<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Early connections to the external hosts used below -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.googletagmanager.com">

<!-- Fonts (loaded without blocking the page) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap"></noscript>

<link rel="icon" href="{{ '/assets/images/base_site_images/icon.webp' | relative_url }}" type="image/webp">

<!-- Title, description, author, canonical URL, Open Graph, X card, JSON-LD -->
{% seo %}

<!-- Stylesheets: only Bootstrap's base styles (reboot) and grid are used -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap-reboot.min.css" integrity="sha384-pJXp6T+qJPS0pqEPqsTy1GJLzTzQz3b9dc/npTXRN9067h/Fdm0eSugSSL7kFQ8i" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap-grid.min.css" integrity="sha384-VIeCCV0aVHr99fkXDSmzLRuJhJWQXe4bDXs6hgg6w6zOTbtAWr8RqSNWu4a2ef9p" crossorigin="anonymous">
<link rel="stylesheet" href="{{ '/assets/css/base-site.css' | relative_url }}">
<!-- Without JavaScript nothing would hide the page loader -->
<noscript><style>#loader { display: none; }</style></noscript>

<!-- Google Analytics -->
{% if site.google_analytics %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}', {
        'anonymize_ip': true,
        'allow_google_signals': false,
        'allow_ad_personalization_signals': false,
        'cookie_flags': 'Secure'
    });
</script>
{% endif %}
