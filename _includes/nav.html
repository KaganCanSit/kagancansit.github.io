<!-- Menu bar. Menu links are edited in _data/navigation.yml. -->
<nav class="modern-navbar">
    <div class="container navbar-container">
        <!-- Hamburger button (small screens) -->
        <button type="button" class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu" aria-controls="mobileSidebar" aria-expanded="false">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

        <!-- Menu links (large screens) -->
        <ul class="desktop-nav">
            {% for item in site.data.navigation %}
            <li><a href="{{ item.url | relative_url }}" class="nav-link">{{ item.title }}</a></li>
            {% endfor %}
        </ul>

        <!-- Theme toggle -->
        <button type="button" class="color-mode" aria-label="Toggle dark mode">
            <span class="color-mode-icon">
                <svg class="theme-icon moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>

                <svg class="theme-icon sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </span>
        </button>
    </div>

    <!-- Slide-in menu (small screens) -->
    <div class="mobile-sidebar" id="mobileSidebar" aria-hidden="true">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="sidebar-content">
            <div class="sidebar-header">
                <a class="sidebar-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
                <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Close menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <ul class="sidebar-links">
                {% for item in site.data.navigation %}
                <li><a href="{{ item.url | relative_url }}" class="sidebar-link">{{ item.title }}</a></li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>
